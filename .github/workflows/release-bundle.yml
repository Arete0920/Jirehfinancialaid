name: Jireh offline release bundle
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_release_bundle.py"
      - "tests/test_release_bundle.py"
      - "docs/RELEASE_PACKAGING.md"
      - ".github/workflows/release-bundle.yml"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - "scripts/build_release_bundle.py"
      - "tests/test_release_bundle.py"
      - "docs/RELEASE_PACKAGING.md"
      - ".github/workflows/release-bundle.yml"
      - "requirements*.txt"
      - "docs/PRODUCTION_READINESS.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-bundle:
    name: Exact-commit offline source and dependency bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build and verify tracked source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python -m unittest discover -s tests -p test_release_bundle.py -v
          python scripts/build_release_bundle.py --revision "$RELEASE_SHA" --output artifacts/offline-bundle
          mkdir -p "$RUNNER_TEMP/jireh-acceptance"
          tar -xf artifacts/offline-bundle/jireh-source.tar -C "$RUNNER_TEMP/jireh-acceptance"
      - name: Prepare and verify offline dependencies
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/artifacts/offline-bundle"
          source="$RUNNER_TEMP/jireh-acceptance/jireh"
          python -m pip download --only-binary=:all: --require-hashes --dest "$bundle/wheels" \
            -r "$source/requirements.txt" -r "$source/requirements-webauthn-ci.txt"
          python -m venv "$RUNNER_TEMP/jireh-offline-venv"
          py="$RUNNER_TEMP/jireh-offline-venv/bin/python"
          "$py" -m pip install --no-index --find-links "$bundle/wheels" --only-binary=:all: --require-hashes \
            -r "$source/requirements.txt" -r "$source/requirements-webauthn-ci.txt"
          "$py" -m pip check
          (cd "$bundle" && sha256sum jireh-source.tar source-evidence.json wheels/*.whl > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Verify packaged closed runtime (no deployment or database connection)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jireh-acceptance/jireh"
          export PYTHONPATH="$PWD/src"
          export JIREH_ENABLE_RUNTIME=1
          export JIREH_ALLOWED_HOSTS=jireh.example.invalid
          export JIREH_DB_NAME=jireh_fixture JIREH_DB_USER=jireh_fixture
          export JIREH_DB_HOST=127.0.0.1 JIREH_DB_PORT=1
          export JIREH_DB_SSLROOTCERT=/etc/ssl/certs/ca-certificates.crt
          py="$RUNNER_TEMP/jireh-offline-venv/bin/python"
          export JIREH_SECRET_KEY="$("$py" -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export JIREH_DB_PASSWORD="$("$py" -c 'import secrets; print(secrets.token_urlsafe(32))')"
          "$py" scripts/verify_restricted_runtime.py --help > /dev/null
          "$py" - <<'PY'
          from jireh.runtime.wsgi import application
          from django.core.management import call_command
          from django.conf import settings
          from django.test import Client
          from django.urls import get_resolver
          call_command("check")
          assert settings.DEBUG is False
          assert settings.ROOT_URLCONF == "jireh.runtime.urls"
          assert {str(item.pattern) for item in get_resolver().url_patterns} == {"healthz/", "readyz/"}
          assert Client().get("/healthz/", secure=True, HTTP_HOST="jireh.example.invalid").status_code == 200
          print("Offline packaged runtime: closed-route liveness PASS; database/deployment NOT TESTED")
          PY
      - name: Verify the offline-installed guided demo starts from extracted source
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jireh-acceptance/jireh"
          py="$RUNNER_TEMP/jireh-offline-venv/bin/python"
          "$py" - <<'PY'
          import runpy
          import signal
          import socket
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          root = Path.cwd()
          # Never contact a pre-existing local process as if it were our demo.
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 8765))
          wait_for_demo = runpy.run_path(str(root / "scripts/verify_local_browser_demo.py"))["wait_for_demo"]
          proc = subprocess.Popen([sys.executable, str(root / "scripts/run_local_browser_demo.py")], cwd=root)
          try:
              wait_for_demo(proc)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open("http://127.0.0.1:8765/local-demo/", timeout=5) as response:
                  page = response.read(2_000_000)
                  assert response.status == 200
                  assert b"Presenter guide" in page and b"Family applicant" in page
                  assert "default-src 'none'" in response.headers["Content-Security-Policy"]
              with opener.open("http://127.0.0.1:8765/workspace/", timeout=5) as response:
                  assert response.status == 200 and b"Sign in" in response.read(2_000_000)
              assert proc.poll() is None
              print("Offline packaged disposable guided demo and workspace startup: PASS")
          finally:
              if proc.poll() is None:
                  proc.send_signal(signal.SIGINT)
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait()
                      raise RuntimeError("Disposable launcher did not stop cleanly")
          assert proc.returncode == 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jireh-offline-bundle-${{ env.RELEASE_SHA }}
          path: artifacts/offline-bundle/
          retention-days: 7
          if-no-files-found: error
