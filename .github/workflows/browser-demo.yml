name: Jireh synthetic browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/browser-demo.yml"
      - "scripts/run_local_browser_demo.py"
      - "scripts/verify_local_browser_demo.py"
      - "src/jireh/schools/demo_*.py"
      - "src/jireh/schools/templates/jireh/demo_page.html"
      - "src/jireh/schools/test_demo_browser.py"
      - "src/jireh/schools/urls.py"
      - "src/jireh/schools/session_views.py"
      - "src/jireh/financial_aid/**"
      - "requirements.txt"

  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-demo.yml"
      - "scripts/run_local_browser_demo.py"
      - "scripts/verify_local_browser_demo.py"
      - "src/jireh/schools/demo_*.py"
      - "src/jireh/schools/templates/jireh/demo_page.html"
      - "src/jireh/schools/test_demo_browser.py"
      - "src/jireh/schools/urls.py"
      - "src/jireh/schools/session_views.py"
      - "src/jireh/financial_aid/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  synthetic-browser:
    name: Synthetic localhost Chromium browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-verified application test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt
      - name: Install isolated Playwright browser test tool
        run: |
          python -m pip install --only-binary=:all: "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - name: Drive disposable synthetic browser and capture evidence
        run: python scripts/verify_local_browser_demo.py
      - name: Inspect public SonarCloud PR findings (diagnostic only)
        if: always() && github.event_name == 'pull_request'
        env:
          JIREH_SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen

          params = urlencode({
              "componentKeys": "Arete0920_Jirehfinancialaid",
              "pullRequest": os.environ["JIREH_SONAR_PR_NUMBER"],
              "resolved": "false",
              "ps": 100,
          })
          url = "https://sonarcloud.io/api/issues/search?" + params
          try:
              with urlopen(url, timeout=20) as response:
                  issues = json.load(response).get("issues", [])
              for issue in issues:
                  print(json.dumps({
                      "rule": issue.get("rule"),
                      "file": issue.get("component"),
                      "line": issue.get("line"),
                      "message": issue.get("message"),
                      "severity": issue.get("severity"),
                      "type": issue.get("type"),
                  }, sort_keys=True))
              if not issues:
                  print("No SonarCloud PR issue details returned.")
          except (HTTPError, URLError, ValueError) as exc:
              print("Public SonarCloud issues API unavailable:", type(exc).__name__, str(exc)[:150])
          PY
      - name: Retain synthetic-only screenshots and video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jireh-synthetic-browser-evidence
          path: artifacts/synthetic-demo/
          if-no-files-found: warn
          retention-days: 14
