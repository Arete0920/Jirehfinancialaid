name: Jireh synthetic browser acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - ".github/workflows/browser-demo.yml"
      - "scripts/run_local_browser_demo.py"
      - "scripts/verify_local_browser_demo.py"
      - "scripts/verify_authenticated_customer_portal.py"
      - "scripts/build_release_bundle.py"
      - "src/**"
      - "requirements*.txt"

  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-demo.yml"
      - "scripts/run_local_browser_demo.py"
      - "scripts/verify_local_browser_demo.py"
      - "scripts/verify_authenticated_customer_portal.py"
      - "scripts/build_release_bundle.py"
      - "src/**"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  synthetic-browser:
    name: Synthetic localhost Chromium browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and extract the tracked acceptance source
        run: |
          set -euo pipefail
          packaged="$RUNNER_TEMP/jireh-browser-source"
          python scripts/build_release_bundle.py --revision "$(git rev-parse HEAD)" --output "$packaged"
          tar -xf "$packaged/jireh-source.tar" -C "$packaged"
          mkdir -p "$packaged/jireh/artifacts/synthetic-demo"
          cp "$packaged/source-evidence.json" "$packaged/jireh/artifacts/synthetic-demo/"
      - name: Install hash-verified application and preproduction cryptography test dependencies
        run: |
          cd "$RUNNER_TEMP/jireh-browser-source/jireh"
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt -r requirements-webauthn-ci.txt
      - name: Install isolated Playwright browser test tool
        run: |
          python -m pip install --only-binary=:all: "playwright==1.65.2"
          python -m playwright install --with-deps chromium
      - name: Drive the extracted disposable synthetic browser and capture evidence
        run: |
          cd "$RUNNER_TEMP/jireh-browser-source/jireh"
          python scripts/verify_local_browser_demo.py
      - name: Verify authenticated portal on disposable HTTPS
        run: |
          cd "$RUNNER_TEMP/jireh-browser-source/jireh"
          PYTHONPATH=src python scripts/verify_authenticated_customer_portal.py
      - name: Verify independent operator portal on disposable HTTPS
        run: |
          cd "$RUNNER_TEMP/jireh-browser-source/jireh"
          PYTHONPATH=src python manage.py test jireh.schools.operator_browser_acceptance.OperatorBrowserAcceptance.test_https_fixture_boundary jireh.schools.operator_browser_acceptance.OperatorBrowserAcceptance.test_operator_browser --settings=jireh.schools.test_settings --noinput
      - name: Inspect public SonarCloud PR findings (diagnostic only)
        if: always() && github.event_name == 'pull_request'
        env:
          JIREH_SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen

          params = urlencode({
              "componentKeys": "Arete0920_Jirehfinancialaid",
              "pullRequest": os.environ["JIREH_SONAR_PR_NUMBER"],
              "resolved": "false",
              "ps": 100,
          })
          url = "https://sonarcloud.io/api/issues/search?" + params
          try:
              with urlopen(url, timeout=20) as response:
                  issues = json.load(response).get("issues", [])
              for issue in issues:
                  print(json.dumps({
                      "rule": issue.get("rule"),
                      "file": issue.get("component"),
                      "line": issue.get("line"),
                      "message": issue.get("message"),
                      "severity": issue.get("severity"),
                      "type": issue.get("type"),
                  }, sort_keys=True))
              if not issues:
                  print("No SonarCloud PR issue details returned.")
          except (HTTPError, URLError, ValueError) as exc:
              print("Public SonarCloud issues API unavailable:", type(exc).__name__, str(exc)[:150])
          PY
      - name: Retain synthetic-only screenshots and video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jireh-synthetic-browser-evidence
          path: ${{ runner.temp }}/jireh-browser-source/jireh/artifacts/synthetic-demo/
          if-no-files-found: warn
          retention-days: 14
