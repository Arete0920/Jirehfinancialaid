name: Jireh current dependency evidence
on:
  pull_request:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "scripts/audit_current_dependencies.py"
      - "tests/test_current_dependency_audit.py"
      - ".github/workflows/browser-demo.yml"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "scripts/audit_current_dependencies.py"
      - "tests/test_current_dependency_audit.py"
      - ".github/workflows/browser-demo.yml"
      - ".github/workflows/dependency-audit.yml"
      - "docs/PRODUCTION_READINESS.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-dependency-evidence:
    name: Current Python dependency public advisory and wheel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_current_dependency_audit.py' -v
      - run: python scripts/audit_current_dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-python-dependency-evidence
          path: artifacts/current-dependency-evidence.json
          retention-days: 14
          if-no-files-found: warn
