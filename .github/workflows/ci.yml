name: Jireh foundation checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python 3.12 contracts and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Reject tracked credential file names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          for path in filter(None, paths):
              name = PurePosixPath(path).name.lower()
              if (name in {"id_rsa", "id_ed25519", "credentials.json", "secrets.json"}
                  or (name.startswith(".env") and not name.endswith(".example"))
                  or name.endswith((".pem", ".key", ".p12", ".pfx", ".sqlite3", ".db"))):
                  blocked.append(path)
          if blocked:
              print("Disallowed tracked credential/data file names:", *blocked, sep="\n")
              sys.exit(1)
          print("Tracked filename hygiene: PASS (not a comprehensive secret scan)")
          PY

      - name: Enforce repository presentation and PR narrative
        run: python scripts/ci/repository_presentation_gate.py

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run financial-aid contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  school-household-models:
    name: Django 5.2 school and household database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install verified Django dependency wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt -r requirements-webauthn-ci.txt

      - name: Verify schema matches migrations
        env:
          PYTHONPATH: src
        run: python -m django makemigrations schools financial_aid --check --dry-run --settings=jireh.schools.test_settings

      - name: Test school and household models
        env:
          PYTHONPATH: src
        run: python -m django test jireh.schools jireh.financial_aid --settings=jireh.schools.test_settings --verbosity=2

  postgresql-integrity:
    name: PostgreSQL 16 migrations and integrity evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jireh_ci
          POSTGRES_USER: jireh_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jireh_ci -d jireh_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: src
      DJANGO_SETTINGS_MODULE: jireh.schools.postgres_test_settings
      JIREH_POSTGRES_CI_ONLY: '1'
      JIREH_POSTGRES_CI_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install verified Django and pinned PostgreSQL test driver
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt -r requirements-webauthn-ci.txt

      - name: Require disposable PostgreSQL 16 (never SQLite fallback)
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", "Must test PostgreSQL"
          with connection.cursor() as cursor:
              cursor.execute("SHOW server_version_num")
              server_version = int(cursor.fetchone()[0])
          assert 160000 <= server_version < 170000, server_version
          print(f"PostgreSQL server_version_num={server_version}; no fallback")
          PY

      - name: Verify migrations match models on PostgreSQL
        run: python -m django makemigrations schools financial_aid --check --dry-run

      - name: Test all Django contracts on PostgreSQL (no expected failures)
        run: |
          set -euo pipefail
          python -m django test jireh.schools jireh.financial_aid --verbosity=2 2>&1 | tee /tmp/jireh-postgresql-tests.log
          if grep -q 'expected failures=' /tmp/jireh-postgresql-tests.log; then
            echo "PostgreSQL known integrity gaps remain unresolved"
            exit 1
          fi

      - name: Verify PostgreSQL trigger migration can reverse and reapply
        run: |
          python -m django migrate --noinput
          python -m django migrate financial_aid 0003 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ('jireh_tenant_link_guard', 'jireh_tenant_app_guard', "
                  "'jireh_tenant_selection_guard', 'jireh_tenant_audit_guard', "
                  "'jireh_school_guard') AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 0, f"Trigger rollback incomplete: {count}"
          print("PostgreSQL trigger rollback: PASS")
          PY
          python -m django migrate financial_aid 0004 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ('jireh_tenant_link_guard', 'jireh_tenant_app_guard', "
                  "'jireh_tenant_selection_guard', 'jireh_tenant_audit_guard', "
                  "'jireh_school_guard') AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 7, f"Trigger reapply incomplete: {count}"
          print("PostgreSQL trigger reapply: PASS")
          PY

      - name: Verify access grant guard migration can reverse and reapply
        run: |
          set -euo pipefail
          python -m django migrate schools 0003 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_household_access_identity_protect', "
                  "'jireh_school_staff_access_identity_protect') "
                  "AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 0, f"Grant trigger rollback incomplete: {count}"
          print("PostgreSQL grant guard rollback: PASS")
          PY
          python -m django migrate schools 0004 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_household_access_identity_protect', "
                  "'jireh_school_staff_access_identity_protect') "
                  "AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 2, f"Grant trigger reapply incomplete: {count}"
          print("PostgreSQL grant guard reapply: PASS")
          PY

      - name: Verify PostgreSQL grant transition history migration replay
        run: |
          set -euo pipefail
          python -m django migrate schools 0004 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_household_grant_transition_capture', "
                  "'jireh_staff_grant_transition_capture', "
                  "'jireh_grant_transition_append_only') "
                  "AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 0, f"Grant transition rollback incomplete: {count}"
          print("Grant transition rollback: PASS")
          PY
          python -m django migrate schools 0005 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_household_grant_transition_capture', "
                  "'jireh_staff_grant_transition_capture', "
                  "'jireh_grant_transition_append_only') "
                  "AND NOT tgisinternal"
              )
              count = cursor.fetchone()[0]
          assert count == 3, f"Grant transition reapply incomplete: {count}"
          print("Grant transition reapply: PASS")
          PY

      - name: Verify invitation audit guard migration reverses and reapplies
        run: |
          set -euo pipefail
          python -m django migrate schools 0006 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_invitation_identity_protect', "
                  "'jireh_invitation_delete_protect', "
                  "'jireh_invitation_event_protect') "
                  "AND NOT tgisinternal"
              )
              assert cursor.fetchone()[0] == 0, "Invitation rollback incomplete"
          print("Invitation guard rollback: PASS")
          PY
          python -m django migrate schools 0007 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger "
                  "WHERE tgname IN ("
                  "'jireh_invitation_identity_protect', "
                  "'jireh_invitation_delete_protect', "
                  "'jireh_invitation_event_protect') "
                  "AND NOT tgisinternal"
              )
              assert cursor.fetchone()[0] == 3, "Invitation reapply incomplete"
          print("Invitation guard reapply: PASS")
          PY

      - name: Verify mailbox redemption guard migration replay
        run: |
          set -euo pipefail
          python -m django migrate schools 0007 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger WHERE "
                  "tgname='jireh_mailbox_challenge_protect' "
                  "AND NOT tgisinternal"
              )
              assert cursor.fetchone()[0] == 0, "Mailbox rollback incomplete"
          print("Mailbox guard rollback: PASS")
          PY
          python -m django migrate schools 0008 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger WHERE "
                  "tgname='jireh_mailbox_challenge_protect' "
                  "AND NOT tgisinternal"
              )
              assert cursor.fetchone()[0] == 1, "Mailbox reapply incomplete"
          print("Mailbox guard reapply: PASS")
          PY

      - name: Verify setup receipt and preparation evidence migration replay
        run: |
          set -euo pipefail
          # Disposable CI database only. Restore the full current schema
          # after the preceding historical migration replay exercises.
          python -m django migrate --noinput
          python -m django migrate schools 0022 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              for table in ('schools_schoolsetupintent', 'schools_schoolpreparationevent'):
                  cursor.execute("SELECT to_regclass(%s)", [table])
                  assert cursor.fetchone()[0] is None, "Preparation table rollback incomplete"
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger WHERE tgname IN (%s, %s)",
                  ['jireh_setup_intent_protect_trigger', 'jireh_school_preparation_protect'],
              )
              assert cursor.fetchone()[0] == 0, "Preparation trigger rollback incomplete"
              for name in ('jireh_setup_intent_immutable()', 'jireh_school_preparation_immutable()'):
                  cursor.execute("SELECT to_regprocedure(%s)", [name])
                  assert cursor.fetchone()[0] is None, "Preparation function rollback incomplete"
          print("Setup receipt/preparation rollback: PASS")
          PY
          python -m django migrate --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              for table, trigger in (
                  ('schools_schoolsetupintent', 'jireh_setup_intent_protect_trigger'),
                  ('schools_schoolpreparationevent', 'jireh_school_preparation_protect'),
              ):
                  cursor.execute(
                      "SELECT COUNT(*) FROM pg_trigger WHERE tgrelid = to_regclass(%s) "
                      "AND tgname = %s AND NOT tgisinternal AND tgenabled = 'O'",
                      [table, trigger],
                  )
                  assert cursor.fetchone()[0] == 1, "Preparation evidence guard not restored"
          print("Setup receipt/preparation reapply: PASS")
          PY

      - name: Verify encrypted questionnaire migration rollback and reapply
        run: |
          set -euo pipefail
          python -m django migrate financial_aid 0008 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute("SELECT to_regclass('financial_aid_syntheticapplicationreview')")
              assert cursor.fetchone()[0] is None, "Review table rollback incomplete"
              cursor.execute("SELECT to_regprocedure('jireh_syn_review_guard()')")
              assert cursor.fetchone()[0] is None, "Review guard rollback incomplete"
          print("Fictional review rollback: PASS")
          PY
          python -m django migrate financial_aid 0007 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              for table in ('financial_aid_syntheticquestionnairedraft',
                            'financial_aid_syntheticquestionnaireevent'):
                  cursor.execute("SELECT to_regclass(%s)", [table])
                  assert cursor.fetchone()[0] is None, "Questionnaire table rollback incomplete"
              for name in ('jireh_syn_questionnaire_guard()', 'jireh_syn_questionnaire_event_guard()'):
                  cursor.execute("SELECT to_regprocedure(%s)", [name])
                  assert cursor.fetchone()[0] is None, "Questionnaire function rollback incomplete"
          print("Questionnaire rollback: PASS")
          PY
          python -m django migrate financial_aid 0009 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              for table, trigger in (
                  ('financial_aid_syntheticquestionnairedraft', 'jireh_syn_questionnaire_guard'),
                  ('financial_aid_syntheticquestionnaireevent', 'jireh_syn_questionnaire_event_guard'),
