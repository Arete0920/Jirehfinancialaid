                  ['financial_aid_fictionalneeddecision', 'jireh_need_decision_protect'],
              )
              assert cursor.fetchone()[0] == 1, "Decision journal guard not restored"
          print("Fictional decision journal reapply: PASS")
          PY

      - name: Check standalone runtime and closed routes (no deployment)
        env:
          JIREH_ENABLE_RUNTIME: '1'
          JIREH_ALLOWED_HOSTS: 'jireh.example.invalid'
          JIREH_DB_NAME: 'jireh_ci'
          JIREH_DB_USER: 'jireh_ci'
          JIREH_DB_HOST: '127.0.0.1'
          JIREH_DB_SSLROOTCERT: '/etc/ssl/certs/ca-certificates.crt'
        run: |
          set -euo pipefail
          export JIREH_DB_PASSWORD="$JIREH_POSTGRES_CI_PASSWORD"
          export JIREH_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python -m django check --settings=jireh.runtime.settings
          python - <<'PY'
          import os
          os.environ['DJANGO_SETTINGS_MODULE'] = 'jireh.runtime.settings'
          import django
          django.setup()
          from django.conf import settings
          from django.test import Client
          from django.urls import Resolver404, get_resolver, resolve
          assert settings.DEBUG is False
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SESSION_COOKIE_SECURE and settings.CSRF_COOKIE_SECURE
          assert settings.DATABASES['default']['OPTIONS']['sslmode'] == 'verify-full'
          assert 'jireh.runtime.telemetry.RuntimeRequestCorrelationMiddleware' in settings.MIDDLEWARE
          runtime_logger = settings.LOGGING['loggers']['jireh.runtime.request']
          assert runtime_logger['level'] == 'INFO'
          assert runtime_logger['propagate'] is False
          assert settings.LOGGING['handlers']['runtime_request']['class'] == 'logging.StreamHandler'
          assert settings.LOGGING['formatters']['runtime_json']['format'] == '%(message)s'
          assert len(get_resolver().url_patterns) == 2, 'Only liveness and readiness may be routed'
          assert resolve('/healthz/').url_name == 'jireh_health'
          assert resolve('/readyz/').url_name == 'jireh_database_readiness'
          from unittest.mock import patch
          from django.db import DatabaseError
          client = Client()
          response = client.get('/healthz/', secure=True, HTTP_HOST='jireh.example.invalid')
          assert response.status_code == 200, response.status_code
          assert response.json() == {'status': 'alive'}
          from uuid import UUID
          cid = response['X-Correlation-ID']
          assert str(UUID(cid)) == cid
          assert response['X-Correlation-ID'] != 'UNTRUSTED'
          assert response['Cache-Control'].find('no-cache') >= 0
          # Runtime TLS/host certificate validation is environment-specific:
          # do not claim a real database roundtrip in this config-only check.
          with patch('jireh.runtime.urls.connection.cursor', side_effect=DatabaseError('secret')):
              denied = client.get('/readyz/', secure=True, HTTP_HOST='jireh.example.invalid')
          assert denied.status_code == 503, denied.status_code
          assert denied.json() == {'status': 'unavailable'}
          assert 'secret' not in denied.content.decode()
          assert 'no-store' in denied['Cache-Control'].lower()
          for path in ('/api/v1/', '/api/v1/schools/', '/admin/', '/login/'):
              try:
                  resolve(path)
              except Resolver404:
                  pass
              else:
                  raise AssertionError(f'Unexpected public route: {path}')
          print('Standalone runtime configuration and route isolation: PASS')
          PY
