name: Jireh foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python 3.12 contracts and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Reject tracked credential file names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          for path in filter(None, paths):
              name = PurePosixPath(path).name.lower()
              if (name in {"id_rsa", "id_ed25519", "credentials.json", "secrets.json"}
                  or (name.startswith(".env") and not name.endswith(".example"))
                  or name.endswith((".pem", ".key", ".p12", ".pfx", ".sqlite3", ".db"))):
                  blocked.append(path)
          if blocked:
              print("Disallowed tracked credential/data file names:", *blocked, sep="\n")
              sys.exit(1)
          print("Tracked filename hygiene: PASS (not a comprehensive secret scan)")
          PY

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run financial-aid contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  school-household-models:
    name: Django 5.2 school and household database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install verified Django dependency wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt

      - name: Verify schema matches migrations
        env:
          PYTHONPATH: src
        run: python -m django makemigrations schools financial_aid --check --dry-run --settings=jireh.schools.test_settings

      - name: Test school and household models
        env:
          PYTHONPATH: src
        run: python -m django test jireh.schools jireh.financial_aid --settings=jireh.schools.test_settings --verbosity=2
