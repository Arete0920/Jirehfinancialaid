                  cursor.execute(
                      "SELECT COUNT(*) FROM pg_trigger WHERE tgrelid = to_regclass(%s) "
                      "AND tgname = %s AND NOT tgisinternal AND tgenabled = 'O'",
                      [table, trigger],
                  )
                  assert cursor.fetchone()[0] == 1, "Questionnaire guard not restored"
              cursor.execute(
                  "SELECT COUNT(*) FROM pg_trigger WHERE tgrelid = "
                  "to_regclass('financial_aid_syntheticapplicationreview') "
                  "AND tgname = 'jireh_syn_review_guard' AND NOT tgisinternal AND tgenabled = 'O'"
              )
              assert cursor.fetchone()[0] == 1, "Review guard not restored"
          print("Questionnaire and fictional review reapply: PASS")
          PY

      - name: Verify fictional decision journal migration rollback and reapply
        run: |
          set -euo pipefail
          python -m django migrate --noinput
          python -m django migrate financial_aid 0010 --noinput
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute("SELECT to_regclass('financial_aid_fictionalneeddecision')")
              assert cursor.fetchone()[0] is None, "Decision journal table rollback incomplete"
              cursor.execute("SELECT to_regprocedure('jireh_need_decision_protect()')")
              assert cursor.fetchone()[0] is None, "Decision journal guard rollback incomplete"
          print("Fictional decision journal rollback: PASS")
          PY
          python -m django migrate --noinput
          python - <<'PY'
          import django
          django.setup()
