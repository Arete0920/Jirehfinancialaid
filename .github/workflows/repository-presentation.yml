name: Jireh repository presentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  presentation-policy:
    name: Repository presentation and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test presentation guard
        run: python -m unittest discover -s tests -p 'test_repository_presentation_gate.py' -v
      - name: Check first-party files and pull request narrative
        run: python scripts/ci/repository_presentation_gate.py
