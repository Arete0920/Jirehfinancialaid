name: Jireh repository presentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-policy:
    name: Repository presentation and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test presentation guard
        run: python -m unittest discover -s tests -p 'test_repository_presentation_gate.py' -v
      - name: Check tracked objects, applicable narrative and repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" \
            -o "$RUNNER_TEMP/repository-metadata.json"
          python scripts/ci/repository_presentation_gate.py --metadata-file "$RUNNER_TEMP/repository-metadata.json"
